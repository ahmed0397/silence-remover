<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D0033"/>
      <stop offset="100%" stop-color="#120018"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#DF37A7"/>
      <stop offset="100%" stop-color="#FF6BD5"/>
    </linearGradient>
  </defs>
  <!-- Background icon squircle -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)"/>
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="15.25" fill="none" stroke="#DF37A7" stroke-width="1.5" stroke-opacity="0.35"/>
  
  <!-- Audio Waveform Bars representing Trimmed Speech -->
  <rect x="11" y="24" width="6" height="16" rx="3" fill="url(#barGrad)"/>
  <rect x="21" y="12" width="6" height="40" rx="3" fill="url(#barGrad)"/>
  <rect x="31" y="18" width="6" height="28" rx="3" fill="url(#barGrad)"/>
  <rect x="41" y="28" width="6" height="8" rx="3" fill="#6B2D5C" opacity="0.8"/>
  <rect x="50" y="22" width="5" height="20" rx="2.5" fill="url(#barGrad)"/>

  <!-- Cut line indicator (showing silence trim) -->
  <path d="M38 12 L46 22" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.9"/>
</svg>
